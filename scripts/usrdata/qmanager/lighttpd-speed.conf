# QManager — gzip for static files and long caching for hashed assets.
# Installed as /usrdata/qmanager/lighttpd-speed.conf only after `lighttpd -tt` accepts it.
server.modules += ( "mod_deflate", "mod_setenv" )

# CGI replies are small and polled often: compress static files only, each once (cached on /usrdata).
$HTTP["url"] !~ "^/(cgi-bin|console)" {
    deflate.mimetypes = ( "text/html", "text/css", "application/javascript", "application/json", "image/svg+xml", "text/plain" )
    deflate.allowed-encodings = ( "gzip" )
    deflate.cache-dir = "/usrdata/qmanager/deflate-cache"
    deflate.compression-level = 6
    deflate.max-loadavg = "2.50"
}

# Next.js puts a content hash in every file name under /_next/static/.
$HTTP["url"] =~ "^/_next/static/" {
    setenv.add-response-header = ( "Cache-Control" => "public, max-age=31536000, immutable" )
}
